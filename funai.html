<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#020817;
    --card:#06142b;
    --card2:#081b38;
    --blue:#008cff;
    --cyan:#00eaff;
    --purple:#9d22ff;
    --pink:#ff3cf7;
    --green:#00ffae;
    --white:#ffffff;
    --muted:#aebbd0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 10% 10%, rgba(0,100,255,.25), transparent 30%),
        radial-gradient(circle at 90% 15%, rgba(157,34,255,.22), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(0,234,255,.12), transparent 35%),
        #020817;
    color:white;
    font-family:"Anek Bangla","Inter",sans-serif;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(120deg, transparent 0%, rgba(0,140,255,.08) 35%, transparent 36%),
        linear-gradient(300deg, transparent 0%, rgba(157,34,255,.07) 40%, transparent 41%);
}

.app{
    width:100%;
    max-width:950px;
    min-height:100vh;
    margin:auto;
    padding:18px;
    position:relative;
}

/* HEADER */

.header{
    height:78px;
    border:1px solid rgba(0,221,255,.65);
    border-radius:24px;
    background:
        linear-gradient(135deg,rgba(7,29,62,.96),rgba(2,12,31,.96));
    box-shadow:
        0 0 15px rgba(0,145,255,.35),
        0 0 35px rgba(0,145,255,.12),
        inset 0 0 25px rgba(0,145,255,.05);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 18px;
    position:relative;
    overflow:hidden;
}

.header::after{
    content:"";
    position:absolute;
    width:180px;
    height:2px;
    right:-30px;
    top:0;
    background:linear-gradient(90deg,transparent,#00eaff,#a400ff);
    box-shadow:0 0 15px #00eaff;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.robot{
    width:52px;
    height:52px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    background:linear-gradient(145deg,#071f46,#08102a);
    border:1px solid #00bfff;
    box-shadow:
        0 0 12px rgba(0,234,255,.7),
        inset 0 0 15px rgba(0,234,255,.12);
}

.brand h1{
    font-family:Georgia,serif;
    font-size:23px;
    letter-spacing:.3px;
}

.brand p{
    color:#8da2c0;
    font-size:12px;
    margin-top:2px;
}

.online{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(0,255,174,.5);
    border-radius:30px;
    padding:8px 14px;
    color:#00ffae;
    font-weight:700;
    font-size:13px;
    box-shadow:0 0 12px rgba(0,255,174,.13);
}

.online-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#00ffae;
    box-shadow:0 0 10px #00ffae;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{
        opacity:.35;
        transform:scale(.7);
    }
}

/* WELCOME */

.welcome{
    margin-top:18px;
    padding:25px 20px;
    border-radius:25px;
    border:1px solid rgba(0,162,255,.4);
    background:
        radial-gradient(circle at 50% 0%,rgba(0,174,255,.13),transparent 55%),
        rgba(3,16,36,.85);
    text-align:center;
    box-shadow:
        0 0 25px rgba(0,120,255,.13),
        inset 0 0 30px rgba(0,120,255,.04);
}

.welcome-badge{
    display:inline-flex;
    padding:7px 18px;
    border-radius:30px;
    border:1px solid transparent;
    border-image:linear-gradient(90deg,#ff28f4,#00eaff) 1;
    background:rgba(5,20,45,.8);
    color:#d7eaff;
    font-size:13px;
    font-weight:700;
    box-shadow:0 0 14px rgba(0,234,255,.12);
}

.welcome h2{
    margin-top:15px;
    font-family:Georgia,serif;
    font-size:clamp(27px,6vw,42px);
    background:linear-gradient(90deg,#fff,#00eaff,#b72cff,#fff);
    background-size:250% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shine 5s linear infinite;
}

@keyframes shine{
    to{
        background-position:250% center;
    }
}

.welcome p{
    margin-top:8px;
    color:#aebbd0;
    font-size:14px;
}

/* CHAT */

.chat-box{
    margin-top:18px;
    height:calc(100vh - 315px);
    min-height:430px;
    max-height:650px;
    overflow-y:auto;
    padding:20px 12px 25px;
    border-radius:25px;
    border:1px solid rgba(0,174,255,.35);
    background:
        linear-gradient(180deg,rgba(4,19,43,.92),rgba(2,11,27,.95));
    box-shadow:
        0 0 30px rgba(0,120,255,.12),
        inset 0 0 30px rgba(0,120,255,.04);
    scroll-behavior:smooth;
}

.chat-box::-webkit-scrollbar{
    width:5px;
}

.chat-box::-webkit-scrollbar-thumb{
    background:linear-gradient(#008cff,#a000ff);
    border-radius:20px;
}

/* MESSAGE */

.message{
    display:flex;
    margin:12px 4px;
    animation:messageIn .3s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.user{
    justify-content:flex-end;
}

.message.ai{
    justify-content:flex-start;
}

.bubble-wrap{
    max-width:82%;
}

.bubble{
    padding:12px 15px;
    border-radius:18px;
    font-size:15px;
    line-height:1.55;
    word-break:break-word;
    position:relative;
    white-space:pre-wrap;
}

.ai .bubble{
    background:
        linear-gradient(135deg,rgba(8,31,65,.98),rgba(4,20,43,.98));
    border:1px solid rgba(0,188,255,.4);
    border-top-left-radius:5px;
    box-shadow:
        0 0 14px rgba(0,145,255,.10),
        inset 0 0 14px rgba(0,145,255,.04);
}

.user .bubble{
    background:
        linear-gradient(135deg,#4012a2,#075fd0);
    border:1px solid rgba(0,238,255,.5);
    border-top-right-radius:5px;
    box-shadow:
        0 0 16px rgba(72,40,255,.22);
}

.sender{
    font-size:11px;
    margin-bottom:4px;
    color:#8da6c8;
}

.user .sender{
    text-align:right;
    color:#9edcff;
}

.copy-btn{
    margin-top:6px;
    border:0;
    background:transparent;
    color:#7d9abb;
    font-size:11px;
    cursor:pointer;
    padding:2px 4px;
}

.copy-btn:hover{
    color:#00eaff;
}

/* TYPING */

.typing{
    display:flex;
    gap:5px;
    align-items:center;
    padding:7px 2px;
}

.typing span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#00eaff;
    box-shadow:0 0 8px #00eaff;
    animation:typing 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.4;
    }

    30%{
        transform:translateY(-5px);
        opacity:1;
    }
}

/* INPUT */

.input-area{
    margin-top:15px;
    display:flex;
    gap:10px;
    align-items:flex-end;
}

.input-wrap{
    flex:1;
    position:relative;
}

#userInput{
    width:100%;
    min-height:58px;
    max-height:130px;
    resize:none;
    padding:17px 18px;
    padding-right:48px;
    color:#fff;
    background:rgba(3,16,35,.95);
    border:1px solid rgba(0,178,255,.55);
    border-radius:19px;
    outline:none;
    font-family:inherit;
    font-size:15px;
    box-shadow:
        0 0 16px rgba(0,130,255,.10),
        inset 0 0 15px rgba(0,130,255,.04);
}

#userInput:focus{
    border-color:#00eaff;
    box-shadow:
        0 0 18px rgba(0,234,255,.18),
        inset 0 0 15px rgba(0,130,255,.05);
}

#userInput::placeholder{
    color:#647b9b;
}

.send-btn{
    width:58px;
    height:58px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    color:white;
    font-size:23px;
    background:linear-gradient(135deg,#9b18ff,#008cff,#00d9ff);
    box-shadow:
        0 0 18px rgba(0,179,255,.38),
        inset 0 0 10px rgba(255,255,255,.12);
    transition:.2s;
}

.send-btn:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:
        0 0 25px rgba(0,234,255,.5);
}

.send-btn:active{
    transform:scale(.94);
}

/* BOTTOM */

.bottom-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:9px;
    padding:0 5px;
}

.hint{
    color:#5f7593;
    font-size:11px;
}

.clear-btn{
    border:1px solid rgba(255,70,150,.35);
    background:rgba(30,5,30,.45);
    color:#ff8fc8;
    border-radius:10px;
    padding:5px 10px;
    cursor:pointer;
    font-family:inherit;
    font-size:11px;
}

.clear-btn:hover{
    border-color:#ff4aa8;
    box-shadow:0 0 10px rgba(255,50,150,.2);
}

/* FOOTER */

.footer{
    text-align:center;
    margin:15px 0 5px;
    color:#687e9c;
    font-size:11px;
}

.footer strong{
    color:#00d9ff;
    text-shadow:0 0 8px rgba(0,217,255,.5);
}

/* MOBILE */

@media(max-width:600px){

    .app{
        padding:10px;
    }

    .header{
        height:68px;
        padding:8px 12px;
        border-radius:20px;
    }

    .robot{
        width:45px;
        height:45px;
        font-size:23px;
    }

    .brand h1{
        font-size:18px;
    }

    .brand p{
        font-size:10px;
    }

    .online{
        padding:7px 10px;
        font-size:11px;
    }

    .welcome{
        padding:20px 14px;
        border-radius:21px;
    }

    .welcome h2{
        font-size:29px;
    }

    .welcome p{
        font-size:12px;
    }

    .chat-box{
        height:calc(100vh - 310px);
        min-height:390px;
        padding:15px 6px 20px;
        border-radius:20px;
    }

    .bubble-wrap{
        max-width:89%;
    }

    .bubble{
        font-size:14px;
        padding:10px 12px;
    }

    #userInput{
        min-height:54px;
        font-size:14px;
    }

    .send-btn{
        width:54px;
        height:54px;
    }

    .hint{
        font-size:9px;
    }
}
</style>
</head>

    en:"Oh! 😎 Then tell me, what do you want to know?",

    banglish:"Oh! 😎 Tahole bolo, ki jante chao?"
},


/* ================= NO ================= */

{
    keywords:[
        "না",
        "নাহ",
        "no",
        "nope",
        "nah",
        "na"
    ],

    bn:"ঠিক আছে 😌 সমস্যা নেই। অন্য কিছু জিজ্ঞেস করো।",

    en:"Alright 😌 No problem. Ask me something else.",

    banglish:"Thik ache 😌 Shomossha nei. Onno kichu jiggesh koro."
}

];


/* =========================================================
   TEXT NORMALIZATION
   ========================================================= */

function normalizeText(text){

    return text
        .toLowerCase()
        .trim()
        .replace(/[?!.,'"/\\:;()[\]{}<>|`~@#$%^&*_+=-]/g," ")
        .replace(/\s+/g," ");

}


/* =========================================================
   LANGUAGE DETECTION
   ========================================================= */

function detectLanguage(text){

    const banglaMatches =
        text.match(/[\u0980-\u09FF]/g) || [];

    const englishMatches =
        text.match(/[a-zA-Z]/g) || [];

    const banglaCount =
        banglaMatches.length;

    const englishCount =
        englishMatches.length;

    if(banglaCount > 0 && englishCount > 0){
        return "mixed";
    }

    if(banglaCount > 0){
        return "bn";
    }

    if(englishCount > 0){
        return "en";
    }

    return "bn";
}


/* =========================================================
   GET RESPONSE
   ========================================================= */

function getResponse(response,language){

    /*
     * নাম/Name সম্পর্কিত predefined response
     * English-এ নাম লিখলেও বাংলা response দিতে হবে।
     */

    if(language === "en"){
        return response.en;
    }

    if(language === "banglish"){
        return response.banglish;
    }

    if(language === "mixed"){
        return response.bn;
    }

    return response.bn;
}


/* =========================================================
   FIND DEFAULT RESPONSE
   ========================================================= */

function findDefaultResponse(text){

    const normalized =
        normalizeText(text);

    for(const item of defaultResponses){

        for(const keyword of item.keywords){

            const key =
                normalizeText(keyword);

            if(
                normalized === key ||
                normalized.includes(key)
            ){

                return item;
            }
        }
    }

    return null;
}


/* =========================================================
   FALLBACK
   ========================================================= */

function getFallback(language){

    if(language === "en"){

        return "I'm not prepared to answer this question 🥲 Please ask me another question 😊";
    }

    if(language === "mixed"){

        return "Ami tomar ei question-er answer দেওয়ার জন্য prepared na 🥲 Apni onno question korun 😊";
    }

    if(language === "bn"){

        return "আমি তোমার এই প্রশ্নের উত্তর দেওয়ার জন্য প্রস্তুত না🥲আপনি অন্য প্রশ্ন করুন😊";
    }

    return "Ami tomar ei proshner uttor dewar jonno ready na 🥲 Apni onno question korun 😊";
}


/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(text,type){

    const chatBox =
        document.getElementById("chatBox");

    const message =
        document.createElement("div");

    message.className =
        `message ${type}`;

    const wrap =
        document.createElement("div");

    wrap.className =
        "bubble-wrap";

    const sender =
        document.createElement("div");

    sender.className =
        "sender";

    sender.textContent =
        type === "user"
        ? "You"
        : "🤖 Khankir Chele AI";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;

    wrap.appendChild(sender);

    wrap.appendChild(bubble);


    if(type === "ai"){

        const copy =
            document.createElement("button");

        copy.className =
            "copy-btn";

        copy.textContent =
            "📋 Copy";

        copy.onclick =
            async function(){

                try{

                    await navigator.clipboard
                        .writeText(text);

                    copy.textContent =
                        "✅ Copied!";

                    setTimeout(()=>{

                        copy.textContent =
                            "📋 Copy";

                    },1200);

                }catch(error){

                    copy.textContent =
                        "Copy failed";

                }

            };

        wrap.appendChild(copy);
    }


    message.appendChild(wrap);

    chatBox.appendChild(message);

    chatBox.scrollTop =
        chatBox.scrollHeight;
}


/* =========================================================
   TYPING
   ========================================================= */

function showTyping(){

    const chatBox =
        document.getElementById("chatBox");

    const message =
        document.createElement("div");

    message.className =
        "message ai";

    message.id =
        "typingMessage";

    message.innerHTML = `
        <div class="bubble-wrap">

            <div class="sender">
                🤖 Khankir Chele AI
            </div>

            <div class="bubble">

                <div class="typing">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </div>
    `;

    chatBox.appendChild(message);

    chatBox.scrollTop =
        chatBox.scrollHeight;
}


/* =========================================================
   REMOVE TYPING
   ========================================================= */

function removeTyping(){

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if(typing){
        typing.remove();
    }
}


/* =========================================================
   SAVE CHAT
   ========================================================= */

function saveChat(){

    const chatBox =
        document.getElementById(
            "chatBox"
        );

    localStorage.setItem(
        "khankirCheleChat",
        chatBox.innerHTML
    );
}


/* =========================================================
   LOAD CHAT
   ========================================================= */

function loadChat(){

    const chatBox =
        document.getElementById(
            "chatBox"
        );

    const saved =
        localStorage.getItem(
            "khankirCheleChat"
        );


    if(saved){

        chatBox.innerHTML =
            saved;


        document
            .querySelectorAll(".copy-btn")
            .forEach(button=>{

                const bubble =
                    button
                    .parentElement
                    .querySelector(".bubble");

                if(!bubble) return;

                const text =
                    bubble.textContent;


                button.onclick =
                    async ()=>{

                        try{

                            await navigator
                                .clipboard
                                .writeText(text);

                            button.textContent =
                                "✅ Copied!";

                            setTimeout(()=>{

                                button.textContent =
                                    "📋 Copy";

                            },1200);

                        }catch(e){}

                    };

            });

    }else{

        addMessage(
            "ওয়েলকাম টু খানকির ছেলে AI তে 😊\n\nআমাকে কিছু জিজ্ঞেস করো। বাংলা, Banglish অথবা English—যে ভাষায় প্রশ্ন করবে, সেই ভাষায় উত্তর দেওয়ার চেষ্টা করব। 🤖",
            "ai"
        );

    }
}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

function sendMessage(){

    const input =
        document.getElementById(
            "userInput"
        );

    const text =
        input.value.trim();

    if(!text) return;


    addMessage(
        text,
        "user"
    );

    input.value = "";

    input.style.height =
        "58px";


    const language =
        detectLanguage(text);


    const response =
        findDefaultResponse(text);


    showTyping();


    const delay =
        450 +
        Math.floor(
            Math.random() * 500
        );


    setTimeout(()=>{

        removeTyping();

        let answer;


        if(response){

            answer =
                getResponse(
                    response,
                    language
                );

        }else{

            answer =
                getFallback(
                    language
                );

        }


        addMessage(
            answer,
            "ai"
        );

        saveChat();

    },delay);

}


/* =========================================================
   ENTER KEY
   ========================================================= */

function handleKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();
    }
}


/* =========================================================
   CLEAR CHAT
   ========================================================= */

function clearChat(){

    const confirmClear =
        confirm(
            "সব chat মুছে ফেলতে চান?"
        );

    if(!confirmClear) return;


    localStorage.removeItem(
        "khankirCheleChat"
    );


    document.getElementById(
        "chatBox"
    ).innerHTML = "";


    addMessage(
        "ওয়েলকাম টু খানকির ছেলে AI তে 😊\n\nআবার শুরু করি! কিছু জিজ্ঞেস করো। 🤖",
        "ai"
    );


    saveChat();
}


/* =========================================================
   TEXTAREA AUTO HEIGHT
   ========================================================= */

const input =
    document.getElementById(
        "userInput"
    );

input.addEventListener(
    "input",
    function(){

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                130
            ) + "px";

    }
);


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

document
    .getElementById("sendBtn")
    .addEventListener(
        "click",
        sendMessage
    );


document
    .getElementById("clearBtn")
    .addEventListener(
        "click",
        clearChat
    );


input.addEventListener(
    "keydown",
    handleKey
);


/* =========================================================
   START APP
   ========================================================= */

loadChat();

</script>
